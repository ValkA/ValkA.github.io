<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash Game Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #game-box {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }

        /* Overlay */
        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        #game-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #00d2d3;
            font-weight: 600;
            word-break: break-all;
            max-width: 90%;
        }

        #start-btn {
            padding: 16px 42px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 18px rgba(255, 71, 87, 0.45);
            cursor: pointer;
            outline: none;
        }

        #sub-note {
            margin-top: 14px;
            opacity: 0.65;
            font-size: 0.85rem;
        }

        /* CSS Fallback prompt for Portrait orientation on iOS / unsupported devices */
        #rotate-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }
    </style>

    <!-- Correct Ruffle CDN build -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- Prompt displayed automatically when in portrait mode -->
    <div id="rotate-warning">
        <p style="font-size: 2rem; margin-bottom: 12px;">🔄</p>
        <p style="font-size: 1.1rem; font-weight: 600;">Please rotate your phone to Landscape mode</p>
    </div>

    <div id="player-container">
        <div id="start-overlay">
            <div id="game-title">Loading...</div>
            <button id="start-btn" onclick="launchGame()">TAP TO PLAY</button>
            <p id="sub-note">Enters Fullscreen & Landscape</p>
        </div>
        <div id="game-box"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const swfFile = urlParams.get('game') || 'angryAviv.swf';

        document.getElementById('game-title').innerText = "Game: " + swfFile;

        async function launchGame() {
            const container = document.documentElement;

            // 1. Fullscreen request (Standard + WebKit)
            try {
                if (container.requestFullscreen) {
                    await container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    await container.webkitRequestFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen request bypassed:", err);
            }

            // 2. Orientation Lock (Works on Android Chrome; Safari ignores it)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    console.log("Orientation lock not permitted or unsupported.");
                });
            }

            // 3. Remove overlay
            document.getElementById('start-overlay').style.display = 'none';

            // 4. Initialize Ruffle Player
            if (!window.RufflePlayer) {
                alert("Ruffle engine could not be loaded. Check your internet connection.");
                return;
            }

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const gameBox = document.getElementById('game-box');
            gameBox.appendChild(player);

            player.config = {
                letterbox: "on",
                scale: "showAll",
                forceScale: true,
                autoplay: "on",
                unmuteOverlay: "hidden"
            };

            // 5. Load the target SWF
            player.load(swfFile).catch(err => {
                console.error("SWF Load Error:", err);
                alert("Failed to load: " + swfFile + ". Verify the file name and location.");
            });
        }
    </script>
</body>
</html>
