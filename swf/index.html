<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash Game Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Default landscape container */
        #game-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Auto-rotate 90 degrees if phone is held in portrait */
        @media screen and (orientation: portrait) {
            #game-box {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }

        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>

    <!-- Configure Ruffle before loading the engine -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            scale: "showAll",
            forceScale: true,
            autoplay: "on",
            unmuteOverlay: "hidden"
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>
</head>
<body>

    <div id="game-box"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const swfFile = urlParams.get('game') || 'angryAviv.swf';

        function boot() {
            if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== "function") {
                setTimeout(boot, 40);
                return;
            }

            const player = ruffle.createPlayer();
