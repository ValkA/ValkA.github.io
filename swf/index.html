<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #game-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Auto-rotate 90 degrees if phone is held in portrait */
        @media screen and (orientation: portrait) {
            #game-box {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }

        ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>

    <!-- Configure Ruffle paths & options before loading script -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/",
            letterbox: "on",
            scale: "showAll",
            forceScale: true,
            autoplay: "on",
            splashScreen: false
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>
</head>
<body>

    <div id="game-box"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const swfFile = urlParams.get('game') || '503.swf';

        function loadGame() {
            if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== "function") {
                setTimeout(loadGame, 50);
                return;
            }

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const gameBox = document.getElementById('game-box');
            gameBox.appendChild(player);

            // Resolve full absolute URL relative to the current folder
            const resolvedUrl = new URL(swfFile, window.location.href).href;

            player.load({
                url: resolvedUrl,
                allowScriptAccess: true
            }).catch(err => {
                console.error("Failed to load SWF:", err);
            });

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadGame);
        } else {
            loadGame();
        }

        // Engage fullscreen on first screen touch/click
        window.addEventListener('pointerdown', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
            }
        }, { once: true });
    </script>
</body>
</html>
