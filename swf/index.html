<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash Game Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Responsive wrapper: normal landscape layout */
        #game-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* If user holds phone in portrait, rotate viewport 90deg and swap dimensions */
        @media screen and (orientation: portrait) {
            #game-box {
                width: 100vh;
                height: 100vw;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }

        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>

    <!-- Configure Ruffle before script load -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            scale: "showAll",
            forceScale: true,
            autoplay: "on",
            unmuteOverlay: "hidden"
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>
</head>
<body>

    <div id="game-box"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const swfFile = urlParams.get('game') || 'angryAviv.swf';

        function initPlayer() {
            if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== "function") {
                // If Ruffle script hasn't finished parsing yet, retry shortly
                setTimeout(initPlayer, 50);
                return;
            }

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const gameBox = document.getElementById('game-box');
            gameBox.appendChild(player);

            player.load(swfFile).catch(err => {
                console.error("SWF Load Error:", err);
            });

            // Attempt native orientation lock if browser allows without gesture
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        // Auto-run immediately when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlayer);
        } else {
            initPlayer();
        }

        // Attempt fullscreen on the very first touch/click anywhere on the game
        window.addEventListener('pointerdown', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
            }
        }, { once: true });
    </script>
</body>
</html>
