<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValkA Productions</title>
    <!-- Auto-redirects to your Google Sites Privacy Policy after 2 seconds -->
    <meta http-equiv="refresh" content="2; url=https://sites.google.com/view/valka-productions/home">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #11141a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1b2029;
            border: 1px solid #2a313d;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 12px; font-size: 26px; color: #ff9900; }
        p { color: #a0aec0; font-size: 15px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #ff9900;
            color: #11141a;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            margin: 12px 8px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: #2d3748;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ValkA Productions</h1>
        <p>Creators of <strong>Pizza Bike Delivery Boy</strong>.</p>
        <p>Redirecting you to our official Privacy Policy in 2 seconds...</p>
        <a class="btn" href="https://sites.google.com/view/valka-productions/home">Open Privacy Policy</a>
        <br>
        <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.ValkA.pizzabikerun">Pizza Bike on Google Play</a>
    </div>
</body>
</html>
